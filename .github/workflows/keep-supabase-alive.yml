name: Keep Supabase alive

on:
  schedule:
    # Todos los días a las 12:00 UTC — el plan free de Supabase pausa el proyecto
    # tras 7 días sin actividad en la API. Diario (en vez de 2 veces por semana) para
    # que algunas corridas fallidas sueltas no dejen huecos peligrosos.
    - cron: '0 12 * * *'
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Consultar la API REST de Supabase
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Falta SUPABASE_URL o SUPABASE_KEY (secret vacío o no configurado)."
            exit 1
          fi
          # --retry-all-errors cubre los fallos de DNS transitorios del runner (curl exit 6).
          status=$(curl -sS -o body.json -w "%{http_code}" \
            --retry 5 --retry-delay 15 --retry-all-errors --max-time 30 \
            "${SUPABASE_URL}/rest/v1/normas_drp?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}")
          echo "HTTP $status"
          cat body.json
          echo
          if [ "$status" -ge 400 ]; then
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      # GitHub deshabilita los workflows programados tras 60 días sin actividad en el repo.
      # Re-habilitar el propio workflow vía API reinicia ese contador sin generar commits.
      - name: Evitar que GitHub deshabilite este workflow por inactividad
        if: always()
        run: |
          curl -sS --fail --retry 3 --retry-all-errors -X PUT \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/keep-supabase-alive.yml/enable"
          echo "Workflow re-habilitado (contador de inactividad reiniciado)."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
